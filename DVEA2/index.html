<!doctype html>
<html lang="en">
  <head>
    <title>Model Viewer Tabs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5dc; /* Beige background */
      }

      header {
        background-color: #2b64ff;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
      }

      model-viewer {
        width: 100vw;
        height: calc(100vh - 80px);
        display: block;
        background-color: #fff;
      }

      /* Tabs */
      .tab-container {
        position: fixed;
        top: 100px;
        left: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        z-index: 10;
        width: 360px;
      }
      .tab-buttons {
        display: flex;
        background: #ddd;
        border-radius: 8px 8px 0 0;
        overflow: hidden;
      }
      .tab-buttons button {
        flex: 1;
        padding: 10px;
        cursor: pointer;
        background: #ddd;
        border: none;
        font-weight: bold;
      }
      .tab-buttons button.active {
        background: #8b27e3;
        color: white;
      }
      .tab-content {
        display: none;
        padding: 10px;
      }
      .tab-content.active {
        display: block;
      }
      .tab-content a {
        display: block;
        margin: 5px 0;
        text-decoration: none;
        color: #333;
        padding: 8px;
        border-radius: 5px;
        background: #eee;
      }
      .tab-content a:hover {
        background: #ddd;
      }

      /* Collapsible */
      details.collapsible {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 220px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        padding: 10px;
        z-index: 10;
        transition: max-height 0.4s ease;
      }
      details.collapsible[open] summary::after {
        content: "\25B2";
        float: right;
      }
      details.collapsible summary::after {
        content: "\25BC";
        float: right;
      }
      details.collapsible summary {
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        list-style: none;
      }
      details.collapsible button {
        margin-top: 5px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 5px;
        background-color: #5a4acb;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      details.collapsible button:hover {
        background-color: #4739a3;
      }
    </style>
  </head>
  <body>
    <header>
      3-in-1 Desk Organiser
    </header>

    <model-viewer id="yay" src="testing101.glb" camera-controls exposure="1.0" shadow-intensity="1" environment-image="neutral"></model-viewer>

    <!-- Tabs UI -->
    <div class="tab-container">
      <div class="tab-buttons">
        <button class="active" onclick="switchTab(event, 'view')">🔍 View</button>
        <button onclick="switchTab(event, 'color')">🎨 Color</button>
        <button onclick="switchTab(event, 'anim')">▶️ Animation</button>
      </div>
      <div id="view" class="tab-content active">
        <a href="#" onclick="setOrbit('744.6deg 0deg 0.4m')" title="Top View">Top</a>
        <a href="#" onclick="setOrbit('570.6deg 179deg 0.4m')" title="Bottom View">Bottom</a>
        <a href="#" onclick="setOrbit('-35.88deg 89.04deg 0.4m')">Front</a>
        <a href="#" onclick="setOrbit('-117.8deg 92.55deg 0.4m')">Right</a>
        <a href="#" onclick="setOrbit('-219.2deg 79.29deg 0.4m')">Back</a>
        <a href="#" onclick="setOrbit('-295.6deg 85.14deg 0.4m')">Left</a>
      </div>
      <div id="color" class="tab-content">
        <a href="#" onclick="setColor('BLUE')">Purple</a>
        <a href="#" onclick="setColor('PURPLE')">Green</a>
        <a href="#" onclick="setColor('GREEN')">Blue</a>
      </div>
      <div id="anim" class="tab-content">
        <a href="#" onclick="playMe('ArmatureAction')">↑ Come Up</a>
        <a href="#" onclick="playMe('ArmatureAction.002')">⇖ Get Out</a>
        <a href="#" onclick="pauseMe()">⏸️ Pause</a>
      </div>
    </div>

    <!-- Advanced Collapsible -->
    <details class="collapsible">
      <summary>Advanced Controls</summary>
      <button onclick="setOrbit('0deg 90deg 0.4m')">Reset Front</button>
      <button onclick="setOrbit('0deg 0deg 0.4m')">Reset Top</button>
    </details>

    <script>
      function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-buttons button').forEach(btn => btn.classList.remove('active'));
        evt.target.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
      }

      function setOrbit(orbit) {
        localStorage.setItem('lastOrbit', orbit);
        document.getElementById('yay').cameraOrbit = orbit;
      }

      function setColor(name) {
        localStorage.setItem('lastColor', name);
        document.getElementById('yay').variantName = name;
      }

      function playMe(animationName) {
        localStorage.setItem('lastAnim', animationName);
        const model = document.getElementById('yay');
        model.pause();
        model.setAttribute('animation-name', animationName);
        model.play({pingpong: true});
      }

      function pauseMe() {
        document.getElementById('yay').pause();
      }

      // Restore last selections on load
      window.onload = () => {
        if (localStorage.getItem('lastOrbit')) setOrbit(localStorage.getItem('lastOrbit'));
        if (localStorage.getItem('lastColor')) setColor(localStorage.getItem('lastColor'));
        if (localStorage.getItem('lastAnim')) playMe(localStorage.getItem('lastAnim'));
      }
    </script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
