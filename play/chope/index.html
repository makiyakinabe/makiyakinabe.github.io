<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chope! Makan Around</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* One phone-sized app. Cream + Peranakan tiles, light only. Big type, one action at a time. */
:root {
  --bg: #FBF4E6; --paper: #FFFDF7; --ink: #2A1A12; --muted: #6B5446;
  --chilli: #C8322A; --teal: #17676B; --kaya: #F2B33D; --butter: #FCE6B0; --mint: #BFE3D3; --sand: #E8DCC8;
  --display: 'Bricolage Grotesque', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; line-height: 1.12; }
p { margin: 0; }
button, input, select { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--teal); outline-offset: 2px; }
[hidden] { display: none !important; }

.tiles { flex-shrink: 0; height: 26px; border-bottom: 2px solid var(--ink); background-color: var(--teal);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 40 40'><path d='M20 5 Q27 13 20 20 Q13 13 20 5Z M20 35 Q27 27 20 20 Q13 27 20 35Z M5 20 Q13 13 20 20 Q13 27 5 20Z M35 20 Q27 13 20 20 Q27 27 35 20Z' fill='%23F3A6B8'/><circle cx='20' cy='20' r='4' fill='%23F2B33D'/><path d='M0 0 H7 Q4 4 0 7Z M40 0 H33 Q36 4 40 7Z M0 40 H7 Q4 36 0 33Z M40 40 H33 Q36 36 40 33Z' fill='%23FBF4E6'/></svg>");
  background-size: 26px 26px; }
.boot { position: absolute; inset: 0; z-index: 90; display: flex; flex-direction: column; background: var(--butter); text-align: center; transition: opacity .45s ease, transform .45s ease; }
.boot.out { opacity: 0; transform: scale(1.05); pointer-events: none; }
.boot .tiles.flip { border-bottom: none; border-top: 2px solid var(--ink); }
.bootmid { flex: 1; display: grid; align-content: center; justify-items: center; gap: 6px; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); }
.bootkk { width: 132px; height: 132px; animation: bootbob 1.6s ease-in-out infinite; }
.bootlogo { margin: 6px 0 0; font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; color: var(--chilli); letter-spacing: -0.02em; }
.boottag { margin: 0 0 18px; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--teal); }
.bootrow { display: flex; justify-content: center; gap: 8px; width: min(292px, 100%); }
.bootrow span { flex: 1 1 0; max-width: 52px; aspect-ratio: 1; border-radius: 50%; border: 2.5px dashed var(--muted); display: grid; place-items: center; }
.bootrow span svg { width: 88%; height: 88%; transform: scale(0); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.bootrow span.on { border: 2.5px solid var(--ink); background: var(--paper); box-shadow: 0 3px 0 var(--ink); }
.bootrow span.on svg { transform: scale(1); }
.bootbar { width: min(240px, 70%); height: 12px; margin-top: 14px; border: 2.5px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.bootbar i { display: block; height: 100%; width: 4%; background: var(--chilli); border-radius: 99px; transition: width .25s ease; }
.boottip { margin: 8px 0 0; min-height: 22px; font-weight: 700; font-size: 15px; color: var(--muted); }
@keyframes bootbob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .bootkk { animation: none; } .boot, .bootrow span svg, .bootbar i { transition: none; } }
.phone { position: relative; transform: translateZ(0); height: 100dvh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.screens { flex: 1; overflow-y: auto; overflow-x: hidden; }
.screen { padding: 12px 14px 28px; display: grid; gap: 14px; align-content: start; }
@media (min-width: 560px) {
  body { background: #EFE3CC; }
  .stage { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .phone { width: 400px; height: min(844px, calc(100dvh - 48px)); min-height: 640px; border: 3px solid var(--ink); border-radius: 44px; box-shadow: 0 10px 0 var(--ink), 0 30px 60px rgba(42, 26, 18, .25); }
}
.phone.big .screens, .phone.big .sheet { zoom: 1.15; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--chilli); line-height: 1; }
.askbtn { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 4px; border-radius: 999px; border: 2px solid var(--ink); background: var(--mint); font-weight: 800; font-size: 14px; cursor: pointer; }
.askbtn svg { width: 36px; height: 36px; }

.tabbar { flex-shrink: 0; display: flex; padding: 6px 6px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 2.5px solid var(--ink); }
.tabbar button { flex: 1 1 0; min-width: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; justify-content: center; border: none; background: transparent; border-radius: 16px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tabbar svg { width: 30px; height: 30px; }
.tabbar button[aria-current="page"] { background: var(--butter); color: var(--chilli); font-weight: 800; }

.btn { min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper); font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); position: relative; overflow: hidden; }
.btn.primary { background: var(--chilli); color: #FFF6E0; }
.btn.big { min-height: 58px; font-family: var(--display); font-size: 21px; width: 100%; }
.btn.small { min-height: 40px; font-size: 14px; padding: 0 14px; box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.linkbtn { border: none; background: none; color: var(--teal); font-weight: 800; font-size: 15px; cursor: pointer; padding: 8px 4px; justify-self: center; }
.card { border-radius: 22px; border: 2.5px solid var(--ink); background: var(--paper); padding: 16px; display: grid; gap: 12px; box-shadow: 0 4px 0 var(--ink); }
.sub { color: var(--muted); font-size: 15px; }
.lab { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }

/* home */
.hero { background: var(--teal); color: #FFF6E0; text-align: center; justify-items: center; padding: 22px 16px; }
.hero h1 { font-size: 36px; }
.hero .art { width: 120px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.three div { display: grid; justify-items: center; gap: 4px; font-family: var(--display); font-weight: 800; font-size: 17px; }
.three span { width: 64px; height: 64px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); display: grid; place-items: center; }
.three svg { width: 44px; height: 44px; }
.hero .btn { width: 100%; }
.hero .btn:not(.primary) { background: var(--kaya); }

/* setup */
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--sand); }
.dots i.on { width: 26px; border-radius: 99px; background: var(--chilli); }
.setup h2 { font-size: 26px; text-align: center; }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.days button { min-height: 64px; border-radius: 16px; border: 2.5px solid var(--ink); background: var(--paper); font-family: var(--display); font-size: 26px; font-weight: 800; cursor: pointer; display: grid; place-items: center; line-height: 1; }
.days small { font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--chilli); color: #FFF6E0; box-shadow: 0 3px 0 var(--ink); }
.days button[aria-pressed="true"] small { color: #FFE3DC; }
.toks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.toks button { position: relative; display: grid; justify-items: center; gap: 4px; padding: 10px 4px; border-radius: 16px; border: 2.5px solid var(--ink); background: var(--paper); cursor: pointer; font-size: 12.5px; font-weight: 800; line-height: 1.15; }
.toks button[aria-pressed="true"] { background: var(--butter); box-shadow: 0 3px 0 var(--chilli); }
.toks .n { position: absolute; top: 4px; left: 4px; background: var(--chilli); color: #FFF6E0; border-radius: 99px; font-size: 11px; padding: 1px 7px; }
.ring { flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--ink); background: #EFE6D8; width: 52px; height: 52px; }
.ring svg { width: 44px; height: 44px; }
.names { display: grid; gap: 8px; }
.names label { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 2px solid var(--ink); border-radius: 16px; background: var(--paper); }
.names .ring { width: 40px; height: 40px; } .names .ring svg { width: 34px; height: 34px; }
.names input { flex: 1; min-width: 0; border: none; background: transparent; font-size: 17px; font-weight: 700; padding: 8px 0; }
.names input:focus { outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chips button { min-height: 52px; padding: 0 18px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper); font-size: 16px; font-weight: 800; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--teal); color: #FFF6E0; }
.row2 { display: flex; gap: 10px; }
.row2 .btn { flex: 1; }
.center { text-align: center; }

/* game */
.players { display: flex; gap: 6px; overflow-x: auto; }
.pl { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); flex-shrink: 0; box-shadow: 0 3px 0 var(--pc); }
.pl.on { background: var(--butter); }
.pl .ring { width: 34px; height: 34px; } .pl .ring svg { width: 29px; height: 29px; }
.pl .nm { font-weight: 800; font-size: 14px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .pts { font-weight: 800; font-size: 14px; color: var(--chilli); font-variant-numeric: tabular-nums; }
.board { position: relative; display: grid; gap: 3px; }
.cell { position: relative; min-width: 0; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2px; font: inherit; color: inherit; cursor: pointer; }
.cell .band { position: absolute; top: 0; left: 0; right: 0; height: 6px; }
.cell .art { width: 70%; max-width: 46px; height: auto; }
.cell .lbl { font-weight: 800; font-size: 10px; line-height: 1.05; }
.board.size-l .cell .lbl { font-size: 8.5px; }
.cell.corner { background: var(--butter); cursor: default; }
.cell.corner.seat { background: var(--mint); } .cell.corner.tray { background: #E3CBB0; } .cell.corner.uncle { background: #FBE0E6; }
.cell.owned { border-width: 3px; }
.cell .pic { position: absolute; top: 7px; left: 3px; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--ink); background: var(--paper); }
.cell .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell.flash { animation: flash .6s ease-out; }
@keyframes flash { 50% { box-shadow: 0 0 0 4px var(--kaya); } }
.mid { border-radius: 16px; border: 2px solid var(--ink); background: var(--teal); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #FFF6E0; }
.mid .rnd { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--butter); }
.dice { display: flex; gap: 10px; }
.die { width: 46px; height: 46px; border-radius: 12px; background: var(--paper); border: 2px solid var(--ink); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; box-shadow: 0 3px 0 var(--ink); }
.die i { width: 8px; height: 8px; border-radius: 50%; place-self: center; }
.die i.on { background: var(--chilli); }
.die.spin { animation: wob .14s linear infinite; }
@keyframes wob { 50% { transform: rotate(10deg); } }
.tok { position: absolute; z-index: 4; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; transition: left .15s, top .15s; pointer-events: none; }
.tok svg { width: 22px; height: 22px; }
.board.size-l .tok { width: 22px; height: 22px; } .board.size-l .tok svg { width: 18px; height: 18px; }

.action { border-radius: 22px; border: 2.5px solid var(--ink); background: var(--paper); padding: 16px; display: grid; gap: 12px; box-shadow: 0 4px 0 var(--ink); }
.action.eat { background: var(--butter); }
.action h2 { font-size: 24px; }
.who { display: flex; align-items: center; gap: 12px; }
.ring.big { width: 72px; height: 72px; } .ring.big svg { width: 62px; height: 62px; }
.dishhead { display: flex; align-items: center; gap: 12px; }
.dishhead > svg { width: 80px; flex-shrink: 0; }
.q { font-size: 18px; font-weight: 700; }
.ans { display: grid; gap: 8px; }
.ans .btn { justify-content: flex-start; text-align: left; border-radius: 14px; box-shadow: none; background: var(--bg); font-size: 16px; padding: 10px 14px; }
.result { font-size: 18px; font-weight: 800; }
.result.ok { color: #2F7D4F; } .result.bad { color: var(--chilli); }
.fact { color: var(--muted); }
.meal { font-size: 15px; padding: 10px 12px; border-radius: 14px; background: var(--butter); border: 2px dashed #C9A35A; }
.note { color: var(--muted); font-size: 14px; }
.tip { font-size: 15px; padding: 10px 12px; border-radius: 14px; background: var(--paper); border: 2px dashed #C9A35A; }
.say { font-family: var(--display); font-size: 34px; font-weight: 800; color: var(--chilli); }
.mrows { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; align-items: center; padding: 10px; border-radius: 18px; border: 2px solid var(--ink); border-left: 7px solid var(--pc); background: var(--paper); }
.mrow.done { background: #EEF7F1; }
.mrow .mdish, .mrow .mph { width: 64px; height: 50px; border: none; background: none; padding: 0; cursor: pointer; }
.mrow .mph { object-fit: cover; border-radius: 10px; border: 2px solid var(--ink); }
.mrow .mdish svg { width: 64px; }
.mrow b { display: block; font-size: 16px; line-height: 1.2; }
.mrow small { font-size: 13px; color: var(--muted); }
.mrow .mb { grid-column: 1 / -1; display: flex; gap: 8px; }
.mrow .mb .btn { flex: 1; }
.mrow .status, .mrow > .btn { grid-column: 1 / -1; }
.status { font-size: 14px; font-weight: 700; padding: 8px 10px; border-radius: 12px; background: #DDF0E4; }
.status.bad { background: #FBE0E6; }
.scores { display: grid; gap: 8px; }
.srow { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.srow .ring { width: 40px; height: 40px; } .srow .ring svg { width: 34px; height: 34px; }
.srow span:last-child { margin-left: auto; font-weight: 800; color: var(--chilli); }
.photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); }

/* dishes */
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dcard { display: grid; gap: 4px; text-align: left; padding: 10px; border-radius: 18px; border: 2.5px solid var(--ink); background: var(--paper); cursor: pointer; font: inherit; color: inherit; box-shadow: 0 3px 0 var(--ink); }
.dcard svg { width: 100%; height: auto; }
.dcard img { width: 100%; aspect-ratio: 60 / 44; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); }
.dcard.no svg { filter: grayscale(1) opacity(.5); }
.dcard b { font-family: var(--display); font-size: 17px; }
.dcard small { font-size: 13px; color: var(--muted); }
.meter { height: 12px; border-radius: 99px; border: 2px solid var(--ink); background: var(--paper); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--chilli); }

/* help */
.how { display: grid; gap: 10px; }
.how div { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; }
.how span { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--ink); background: var(--butter); display: grid; place-items: center; flex-shrink: 0; }
.how svg { width: 38px; height: 38px; }
.opt { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 800; padding: 12px; border: 2px solid var(--ink); border-radius: 16px; background: var(--paper); cursor: pointer; }
.opt input { width: 22px; height: 22px; accent-color: var(--chilli); }

/* stories */
.snapcard { background: var(--teal); color: #FFF6E0; }
.snaprow { display: flex; align-items: center; gap: 12px; }
.snaprow svg { width: 58px; height: 58px; flex-shrink: 0; background: var(--paper); border-radius: 50%; border: 2px solid var(--ink); padding: 7px; }
.snaprow h2 { font-size: 22px; }
.snaprow p { color: #D7EEF0; font-size: 15px; }
.cats { justify-content: flex-start; gap: 6px; }
.cats button { min-height: 44px; padding: 0 14px; font-size: 15px; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.scard { display: grid; gap: 4px; align-content: start; text-align: left; padding: 8px 8px 10px; border-radius: 18px; border: 2.5px solid var(--ink); background: var(--paper); cursor: pointer; font: inherit; color: inherit; box-shadow: 0 3px 0 var(--ink); }
.sart { aspect-ratio: 4 / 3; border-radius: 12px; border: 2px solid var(--ink); display: grid; place-items: center; overflow: hidden; margin-bottom: 2px; }
.sart svg { width: 64%; height: 82%; }
.sart img { width: 100%; height: 100%; object-fit: cover; }
.scard b { font-family: var(--display); font-size: 17px; line-height: 1.15; }
.scard small { font-size: 13px; color: var(--muted); font-weight: 700; }
.word { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--chilli); background: var(--paper); border: 2px solid var(--ink); border-radius: 18px 18px 18px 4px; padding: 4px 14px; box-shadow: 0 3px 0 var(--ink); }
.stbig { width: 100%; height: 200px; flex-shrink: 0; border-radius: 20px; border: 2.5px solid var(--ink); display: grid; place-items: center; overflow: hidden; }
.stbig svg { width: 46%; height: 86%; }
.stbig img { width: 100%; height: 100%; object-fit: cover; }
.stbig .word { font-size: 46px; }
.found { font-weight: 800; color: #2F7D4F; }
.story { display: grid; gap: 6px; }
.story p { font-size: 18px; line-height: 1.45; padding: 6px 10px; border-radius: 12px; transition: background .2s; }
.story p.now, .didyou.now { background: var(--butter); box-shadow: inset 5px 0 0 var(--chilli); }
.didyou { padding: 12px; border-radius: 16px; border: 2px dashed #C9A35A; background: var(--paper); display: grid; gap: 4px; }
.didyou p { font-size: 16px; font-weight: 700; }

/* trip features */
.where { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; border: 2px solid var(--ink); background: var(--paper); }
.where b { display: block; font-size: 16px; }
.where small { font-size: 13px; color: var(--muted); }
.open { font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 99px; white-space: nowrap; }
.open.yes { background: #DDF0E4; color: #1E5E3A; }
.open.no { background: #FCEFC8; color: #7A5200; }
.pay { display: grid; gap: 6px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchips span { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 99px; background: var(--paper); border: 2px solid var(--ink); }
.wx { display: flex; gap: 6px; justify-content: center; }
.wx button { min-height: 44px; padding: 0 12px; border-radius: 99px; border: 2px solid var(--ink); background: var(--paper); font-weight: 800; font-size: 14px; cursor: pointer; }
.wx button[aria-pressed="true"] { background: var(--kaya); }
.reqs { display: flex; flex-wrap: wrap; gap: 6px; }
.reqs button { min-height: 44px; padding: 0 12px; border-radius: 99px; border: 2px solid #FFF6E0; background: transparent; color: #FFF6E0; font-weight: 800; font-size: 14px; cursor: pointer; }
.reqs button[aria-pressed="true"] { background: #FFF6E0; color: var(--ink); }
.chips.small button { min-height: 44px; padding: 0 12px; font-size: 14px; }
.budget .brow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

  // dishes to play with: the ones this roll could land on first, then the rest of the board, then any other dish
  function mgDishes(n, ok) {
    const f = ok || (() => true), near = [], board = [];

    if (!mg || mg.kind !== 'wipe' || mg.done) return;

    if (!cv) return;
    const box = cv.parentNode, w = box.clientWidth || 300, h = box.clientHeight || 220, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    if (!c) { cv.remove(); return; }
    c.scale(dpr, dpr);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#F7F2EA'); g.addColorStop(1, '#D8CFC2');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 6; c.lineCap = 'round';
    for (let i = 0; i < 6; i++) { const x = w * (0.12 + 0.152 * i), y = h * (0.3 + 0.4 * ((i * 37) % 10) / 10); c.beginPath(); c.moveTo(x, y + 28); c.bezierCurveTo(x - 18, y + 10, x + 18, y - 8, x, y - 26); c.stroke(); }
    c.globalCompositeOperation = 'destination-out'; c.lineWidth = Math.max(38, w * 0.15); c.lineJoin = 'round';
    let last = null;
    const at = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (w / (r.width || w)), (e.clientY - r.top) * (h / (r.height || h))]; };
    const rub = (e) => { const p = at(e); c.beginPath(); c.moveTo(last ? last[0] : p[0] - 0.1, last ? last[1] : p[1]); c.lineTo(p[0], p[1]); c.stroke(); last = p; const hd = $('#mghand'); if (hd) hd.remove(); };
    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* fine without */ } last = null; rub(e); });
    cv.addEventListener('pointermove', (e) => { if (last) rub(e); });
    const end = () => { last = null; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  }

    renderSheet(true);

      mg.pick = null; mg.i += 1;
      if (mg.i >= mg.pairs.length) mgEnd(mg.marks.filter(Boolean).length >= Math.min(2, mg.pairs.length)); else renderSheet(true);
    });
  }

  // the end card: what you just learned, and the Lucky Roll if you won it
  function mgLearnHtml() {
    const tile = (id, extra) => `<div>${dishSvg(id)}${esc(DISHES[id].label)}${extra || ''}</div>`;
    if (mg.kind === 'wipe') return `<div class="mglearn"><div class="dishhead">${dishSvg(mg.id)}<div><h3>${esc(DISHES[mg.id].label)}</h3><p class="fact">${esc(QUIZ[mg.id].f)}</p></div></div></div>`;
    if (mg.kind === 'wok') return `<div class="mglearn"><div class="dishhead">${dishSvg(mg.id)}<div><p class="lab">What goes in</p><h3>${esc(DISHES[mg.id].label)}</h3></div></div><div class="mgeq">${ING[mg.id][0].map((k) => `<span>${ingSvg(k)}${esc(INGR[k][0])}</span>`).join('')}</div>${mg.id === 'carrotcake' ? '<p class="fact center">No carrot at all! The "carrot" is white radish.</p>' : ''}</div>`;
    if (mg.kind === 'rush') return `<div class="mglearn"><div class="mgset">${mg.orders.map((id, i) => tile(id, `<em>${mg.marks[i] ? '✓' : '✗'}</em>`)).join('')}</div><p class="fact center">Order like a local: "${esc(ORDER[mg.orders[0]])}"</p></div>`;
    const ids = [];
    mg.pairs.forEach((p) => p.forEach((id) => { if (!ids.includes(id)) ids.push(id); }));
    ids.sort((a, b) => spiceOf(b) - spiceOf(a));
    return `<div class="mglearn"><div class="mgset">${ids.map((id) => tile(id, chilIcon(id))).join('')}</div><p class="fact center">😌 not spicy · 🌶️ a little · 🌶️🌶️ spicy</p></div>`;
  }
  function mgResultHtml() {
    const w = mg.win, live = mgLive(), n = mg.marks ? mg.marks.filter(Boolean).length : 0;
    const said = mg.kind === 'wipe' ? (w ? 'You got it!' : 'It was ' + DISHES[mg.id].label + '.') : mg.kind === 'wok' ? (w ? 'Nicely cooked!' : 'The wok burned. Here is what goes in.') : mg.kind === 'rush' ? 'You served ' + n + ' of 3.' : n + ' of ' + mg.pairs.length + ' right.';
    return `${head(MG_NAME[mg.kind])}
      <div class="mgres ${w ? 'ok' : 'bad'}" role="status"><p class="mgbig">${w ? 'Shiok!' : 'Alamak!'}</p><p>${esc(said)}</p></div>
      ${mgLearnHtml()}
      ${live ? (w ? '<p class="lucky">🍀 <b>Lucky Roll!</b> You get 2 rolls. Pick the dish you want.</p>' : '<p class="note center">No Lucky Roll this time. Try again next turn!</p>') : ''}
      <button class="btn big primary" type="button" data-a="mgroll">${live ? (w ? 'Lucky Roll 🍀' : 'Roll now') : 'Done'}</button>`;
  }
  function miniHtml() {
    if (!mg) return head('Quick game');
    if (mg.done) return mgResultHtml();
    return mg.kind === 'wipe' ? mgWipeHtml() : mg.kind === 'wok' ? mgWokHtml() : mg.kind === 'rush' ? mgRushHtml() : mgDuelHtml();
  }

  // on the board: the invitation before you roll, and the two rolls to pick from after a win
  function warmHtml() {
    if (S.warm) return S.warm.win ? '<p class="lucky">🍀 <b>Lucky Roll!</b> You get 2 rolls. Pick the dish you want.</p>' : '';
    const k = mgNextKind();
    return `<button class="warm" type="button" data-a="warm"><span class="wi" aria-hidden="true">${MG_ICON[k]}</span><span><b>Quick game first?</b><small>Win a 🍀 Lucky Roll</small></span><span class="go" aria-hidden="true">▶</span></button>`;
  }
  const pickPos = (d) => (cur().pos + d[0] + d[1]) % S.spaces.length;
  function pickHtml() {
    const p = cur();
    return `<div class="who"><span class="ring" style="background:${col(S.cur).ring}">${tokSvg(p.token)}</span><h2>🍀 Pick your roll</h2></div>
      <div class="picks">${S.pick.map((d, i) => {
        const sp = S.spaces[pickPos(d)], st = sp.t === 'stall', o = st ? S.own[sp.id] : undefined;
        const sub = st ? (o === undefined ? 'Win this stall' : o === S.cur ? 'Your stall · +1 ★' : esc(S.players[o].name) + '\'s stall') : sp.t === 'uncle' ? 'Singlish question' : '+1 ★';
        return `<button type="button" data-a="pickroll" data-i="${i}">${st ? dishSvg(sp.id) : `<svg viewBox="0 0 32 32" aria-hidden="true">${ICON[sp.t]}</svg>`}<b>${esc(st ? DISHES[sp.id].label : CORNER[sp.t].label)}</b><small>${sub}</small><span class="dn">🎲 ${d[0] + d[1]}</span></button>`;
      }).join('')}</div>`;
  }
  async function pickRoll(i) {
    if (busy || !S || S.phase !== 'pick' || !S.pick || !S.pick[i] || !isMine(S.cur)) return;
    const p = cur();
    S.dice = S.pick[i]; S.pick = null; S.phase = 'roll'; busy = true;
    renderDice(false); placeTokens(); renderAction();
    for (let k = 0; k < S.dice[0] + S.dice[1]; k++) { p.pos = (p.pos + 1) % S.spaces.length; placeTokens(); await sleep(170); }
    busy = false;
    land();
  }

  if (window.__chopeTest) window.__mgPeek = () => (mg ? JSON.parse(JSON.stringify(mg)) : null);
  function openSheet(name, arg) { sheet = name; sheetArg = arg === undefined ? null : arg; if (name === 'dish') orderLang = null; if (name === 'h101') h101Idx = 0; renderSheet(true); const f = $('#sheet button, #sheet input'); if (f) f.focus({ preventScroll: true }); }
  function closeSheet() { if (sheet === 'mini') mg = null; if (sheet === 'h101') markSeen('h101'); if (sheet === 'story' || sheet === 'snap' || sheet === 'place') { stopStory(); foundBy = null; } if (placeView) { placeView.dispose(); placeView = null; } if (sheet === 'ar') arStop(); if (sheet === 'place' && mapReturn) { mapReturn = false; openSheet('bigmap'); return; } const was = sheet; sheet = null; renderSheet(true); if (was === 'sing') { try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ } } if (was === 'me' || was === 'kopi' || was === 'sing') render(); else if (tab === 'stories') renderStories(); }
  function renderSheet(force) {
    $('#ov').hidden = !sheet;
    if (!sheet) return;
    if (!force && (sheet === 'chat' || sheet === 'story' || sheet === 'snap' || sheet === 'join' || sheet === 'postcard' || sheet === 'place' || sheet === 'ar' || sheet === 'bigmap' || sheet === 'me' || sheet === 'kopi' || sheet === 'sing' || sheet === 'mini')) return;
    const el = $('#sheet');
    el.className = 'sheet' + (sheet === 'h101' ? ' h101' : '') + (sheet === 'ar' || sheet === 'bigmap' ? ' ar' : '') + (sheet === 'mini' ? ' mini' : '');
    el.setAttribute('aria-label', { dish: 'Dish', change: 'Change dish', h101: 'Hawker 101', chat: 'Ask Kopi Kaki', story: 'Story', snap: 'Snap a place', join: 'Join friends', invite: 'Invite friends', postcard: 'Makan Passport', place: 'Explore', ar: 'AR view', bigmap: '3D map of Singapore', me: 'Make it yours', kopi: 'My kopi', sing: 'Singlish Corner', mini: 'Quick game' }[sheet]);
    if (sheet === 'dish') el.innerHTML = dishHtml(sheetArg);
    if (sheet === 'change') el.innerHTML = changeHtml(sheetArg);
    if (sheet === 'h101') el.innerHTML = h101Html();
    if (sheet === 'story') el.innerHTML = storyHtml(getStory(sheetArg));
    if (sheet === 'snap') el.innerHTML = snapHtml();
    if (sheet === 'join') el.innerHTML = joinHtml();
    if (sheet === 'invite') el.innerHTML = inviteHtml();
    if (sheet === 'postcard') el.innerHTML = postcardHtml();
    if (sheet === 'place') { el.innerHTML = placeHtml(sheetArg); mountPlace(sheetArg); }
    if (sheet === 'ar') { el.innerHTML = arHtml(sheetArg); mountAR(sheetArg); }
    if (sheet === 'bigmap') { el.innerHTML = bigmapHtml(); mountMap(true); }
    if (sheet === 'me') el.innerHTML = meHtml();
    if (sheet === 'kopi') el.innerHTML = kopiHtml();
    if (sheet === 'mini') { el.innerHTML = miniHtml(); mgMount(); }
    if (sheet === 'sing') el.innerHTML = singHtml();
    if (sheet === 'chat') { el.innerHTML = chatHtml(); const b = $('#msgs'); if (b) b.scrollTop = b.scrollHeight; }
  }

  // ---------- events ----------
  function showTab(t) {
    if (tab === 'sing' && t !== 'sing') sgQuiet();
    if (t === 'sing' && tab !== 'sing' && sg.view === 'game' && sg.game && sg.game.i >= sg.game.q.length) sg.view = 'wall';
    tab = t;
    ['play', 'stories', 'sing', 'dishes', 'help'].forEach((n) => { $('#scr-' + n).hidden = n !== t; });
    document.querySelectorAll('.tabbar [data-tab]').forEach((b) => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#screens').scrollTop = 0;
    render();
  }
  document.addEventListener('click', (e) => {
    const tb = e.target.closest('[data-tab]');
    if (tb) { showTab(tb.dataset.tab); return; }
    const dz = e.target.closest('[data-dish]');
    if (dz && !e.target.closest('[data-a]')) { openSheet('dish', dz.dataset.dish); return; }
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    const a = b.dataset.a;
    if (a === 'setup') { if (online) leaveGroup(); S = null; setup.open = true; setup.step = 1; setup.tokens = []; setup.diet = []; setup.kids = false; setup.online = false; showTab('play'); }
    else if (a === 'quick') { setup.days = 3; setup.tokens = ['merlion']; setup.names = {}; setup.diet = []; setup.kids = false; setup.online = false; setup.open = false; newGame(); showAction(); }
    else if (a === 'eatlater') eatLater();
    else if (a === 'confirmlater') { const i = Number(b.dataset.i); laterDone(i, laterMsg[i] && laterMsg[i].thumb); }
    else if (a === 'cancel') { setup.open = false; render(); }
    else if (a === 'days') { setup.days = Number(b.dataset.d); renderSetup(); }
    else if (a === 'step') { setup.step = Number(b.dataset.s); renderSetup(); $('#screens').scrollTop = 0; }
    else if (a === 'tok') { const k = b.dataset.k, i = setup.tokens.indexOf(k); if (i >= 0) setup.tokens.splice(i, 1); else if (setup.tokens.length < 6) { setup.tokens.push(k); if (setup.tokens.length === 1 && myName() && !setup.names[k]) setup.names[k] = myName(); } renderSetup(); }
    else if (a === 'diet') { const d = b.dataset.d, i = setup.diet.indexOf(d); if (i >= 0) setup.diet.splice(i, 1); else setup.diet.push(d); renderSetup(); }
    else if (a === 'start') { setup.open = false; newGame(); showAction(); }
    else if (a === 'continue') render();
    else if (a === 'ready') { S.phase = 'roll'; render(); }
    else if (a === 'roll') { if (!busy && S.phase === 'roll') { hintsDone(); markSeen('c-bot'); doRoll(); } }
    else if (a === 'ans') { hintsDone(); answer(Number(b.dataset.i)); }
    else if (a === 'next') { hintsDone(); markSeen('c-meal'); next(); }
    else if (a === 'change') openSheet('change', Number(b.dataset.pi));
    else if (a === 'setdish') setDish(Number(b.dataset.pi), b.dataset.id);
    else if (a === 'confirm') { const pi = Number(b.dataset.pi); if (online) sendMeal(pi, S.missions[pi].id, pendingThumb[pi]); else eatDone(pi, pendingThumb[pi]); }
    else if (a === 'close') closeSheet();
    else if (a === 'h101') openSheet('h101');
    else if (a === 'hnext') { h101Idx += 1; renderSheet(true); }
    else if (a === 'hback') { h101Idx -= 1; renderSheet(true); }
    else if (a === 'hdone') closeSheet();
    else if (a === 'chat') openSheet('chat');
    else if (a === 'ask') ask(b.dataset.q);
    else if (a === 'lang') { orderLang = b.dataset.l; renderSheet(true); }
    else if (a === 'say') sayOrder(b.dataset.id, b.dataset.l);
    else if (a === 'cat') { storyCat = b.dataset.c; renderStories(); }
    else if (a === 'story') openStory(b.dataset.id);
    else if (a === 'play') { if (speaking) stopStory(); else playStory(getStory(sheetArg)); }
    else if (a === 'nextstory') nextStory();
    else if (a === 'quit') { leaveGroup(); S = null; save(); showTab('play'); }
    else if (a === 'join') { joinState = null; openSheet('join'); }
    else if (a === 'claim') claimSeat(Number(b.dataset.pi));
    else if (a === 'invite') openSheet('invite');
    else if (a === 'leave') { leaveGroup(); S = null; save(); showTab('play'); }
    else if (a === 'playfor') { covering = S.cur; renderAction(); }
    else if (a === 'wx') { prefs.weather = b.dataset.w; savePrefs(); renderAction(); }
    else if (a === 'budget') { prefs.budget = Number(b.dataset.v); savePrefs(); renderDishes(); }
    else if (a === 'locate') locate();
    else if (a === 'req') { const r = myReqs().slice(), k = b.dataset.k, i = r.indexOf(k); if (i >= 0) r.splice(i, 1); else r.push(k); prefs.reqs = r; savePrefs(); renderSheet(true); }
    else if (a === 'postcard') openPostcard();
    else if (a === 'savecard') { if (postcardBlob) saveFile('makan-passport.png', postcardBlob, 'Saved! ✓').then((m) => { postcardMsg = m; renderSheet(true); }); }
    else if (a === 'sharecard') { try { navigator.share({ files: [new File([postcardBlob], 'makan-passport.png', { type: 'image/png' })], title: 'My Makan Passport' }).catch(() => {}); } catch (er) { /* no share */ } }
    else if (a === 'savepack') savePack();
    else if (a === 'place') { if (!(b.classList.contains('pin') && mapView && Date.now() - (mapView.dragAt || 0) < 350)) openPlace(b.dataset.id); }
    else if (a === 'ar') { const id = sheetArg; stopStory(); if (placeView) { placeView.dispose(); placeView = null; } arNote = ''; openSheet('ar', id); }
    else if (a === 'arclose') { const id = sheetArg; arStop(); openSheet('place', id); }
    else if (a === 'arsize') { if (arView && arView.objs[0]) arView.objs[0].s = Math.max(0.3, Math.min(3, arView.objs[0].s * (b.dataset.d === '1' ? 1.15 : 0.87))); }
    else if (a === 'arsave') arSave();
    else if (a === 'bigmap') { mapReturn = false; openSheet('bigmap'); }
    else if (a === 'mapzoom') mapZoom(+b.dataset.d);
    else if (a === 'mapnight') setNight(!mapNight);
    else if (a === 'me') openMe();
    else if (a === 'meredo') openMe(true);
    else if (a === 'mestep') { meStep = Number(b.dataset.s); renderSheet(true); $('#sheet').scrollTop = 0; }
    else if (a === 'mespice') { meDraft.spice = Number(b.dataset.v); meStep = 3; renderSheet(true); }
    else if (a === 'melove') { const k = b.dataset.k, i = meDraft.loves.indexOf(k); if (i >= 0) meDraft.loves.splice(i, 1); else meDraft.loves.push(k); b.setAttribute('aria-pressed', String(i < 0)); }
    else if (a === 'medone') meDone();
    else if (a === 'kopi') openKopi();
    else if (a === 'kset') kopiSet(b.dataset.row, b.dataset.v);
    else if (a === 'kopisay') kopiSpeak();
    else if (a === 'sing') openSing();
    else if (a === 'sgwall') { sgQuiet(); sg.view = 'wall'; renderSing(); $('#screens').scrollTop = 0; }
    else if (a === 'sggrp') { sg.grp = b.dataset.g; renderSing(); }
    else if (a === 'sgcard') sgOpenCard(b.dataset.id);
    else if (a === 'sgsay') sgSpeak(sgWord(sg.id));
    else if (a === 'sggame') { sgQuiet(); sg.view = 'game'; sgNewGame(); renderSing(); $('#screens').scrollTop = 0; }
    else if (a === 'sgpick') sgAnswer(b.dataset.id);
    else if (a === 'sgnext') sgNext();
    else if (a === 'warm') openMini();
    else if (a === 'pickroll') pickRoll(Number(b.dataset.i));
    else if (a === 'mgpick') { if (mg && mg.kind === 'wipe' && !mg.done) { mg.pick = b.dataset.id; mgEnd(mg.pick === mg.id); } }
    else if (a === 'mgblow') mgBlow();
    else if (a === 'mging') mgIng(b.dataset.k);
    else if (a === 'mgserve') mgServe(b.dataset.id);
    else if (a === 'mgduel') mgDuel(b.dataset.id);
    else if (a === 'mgroll') mgRoll();
    else if (a === 'kopisave') { prefs.kopi = Object.assign({}, kopiDraft); savePrefs(); kopiSaved = true; renderSheet(true); }
  });
  document.addEventListener('input', (e) => { if (e.target.dataset.name) setup.names[e.target.dataset.name] = e.target.value; if (e.target.dataset.mename !== undefined) meDraft.name = e.target.value; });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.snap !== undefined) { hintsDone(); snap(Number(t.dataset.snap), t.files && t.files[0]); }
    if (t.dataset.arphoto !== undefined) { const f = t.files && t.files[0]; t.value = ''; arPhoto(f); }
    if (t.dataset.later !== undefined) snapLater(Number(t.dataset.later), t.files && t.files[0]);
    if (t.dataset.placephoto !== undefined) { const f = t.files && t.files[0]; t.value = ''; snapPlace(f); }
    if (t.dataset.own !== undefined) setup.online = t.checked;
    if (t.dataset.kids !== undefined) setup.kids = t.checked;
    if (t.dataset.openonly !== undefined) { nearOpen = t.checked; renderDishes(); }
    if (t.dataset.wallet !== undefined) { prefs.wallet = t.value; savePrefs(); }
    if (t.dataset.area !== undefined) { if (t.value !== 'gps') { prefs.area = t.value; prefs.loc = null; savePrefs(); } renderDishes(); }
    if (t.dataset.paid !== undefined) setPaid(t.dataset.paid, t.value);
    if (t.dataset.pref === 'big') { prefs.big = t.checked; try { localStorage.setItem('chope-simple-prefs', JSON.stringify(prefs)); } catch (er) { /* ignore */ } $('#phone').classList.toggle('big', prefs.big); if (S) { sizeBoard(); placeTokens(); } }
  });
  document.addEventListener('submit', (e) => { if (e.target.id === 'joinform') { e.preventDefault(); findGame($('#joinin').value); return; } if (e.target.id === 'chatform') { e.preventDefault(); const i = $('#chatin'); const v = i.value; i.value = ''; ask(v); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet) closeSheet(); });
  $('#ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeSheet(); });
  window.addEventListener('resize', () => { if (S && !setup.open) { sizeBoard(); placeTokens(); } });

  // ---------- boot ----------
  $('#phone').classList.toggle('big', !!prefs.big);
  S = loadSaved();
  try { online = JSON.parse(localStorage.getItem('chope-simple-online') || 'null'); } catch (e) { online = null; }
  if (S) { if (S.phase === 'bot' && !online) S.phase = 'roll'; buildBoard(); }
  if (online && S) lastPushed = packState();
  render();
  if (S && !online && cur().bot && S.phase === 'roll') startTurn(S.cur);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S) placeTokens(); });
  (async () => {
    try {
      const fn = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null;
      if (fn) { sampleFn = fn; const lim = await fn.limits().catch(() => null); sampleImages = !!(lim && lim.images); }
    } catch (e) { /* no Claude */ }
  })();
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') { const [d, dl] = await Promise.all([window.claude.use('db'), window.claude.use('downloads')]); db = d || null; dlFn = dl || null; } } catch (e) { /* no store */ }
    if (online && !db) { leaveGroup(); }
    if (online && db) subscribe();
    render();
  })();
  (function loading() {
    const el = $('#boot');
    if (!el) return;
    const fill = $('#bootfill'), tip = $('#boottip'), plates = [...document.querySelectorAll('#bootrow span')], t0 = Date.now(), parts = [$('#screens'), document.querySelector('.tabbar')];
    const TIPS = ['Setting the table…', 'Choping a seat with a tissue packet…', 'Frying the char kway teow…', 'Building the island…', 'Pouring your kopi…'];
    ['kaya', 'chicken', 'laksa', 'satay', 'chendol'].forEach((id, i) => { if (plates[i]) plates[i].innerHTML = dishSvg(id); });
    parts.forEach((p) => { if (p) p.inert = true; });
    // the work: build every 3D model and its card picture now, one small job at a time, so Explore opens at once later
    const ids = Object.keys(EXPLORE), jobs = ids.map((id) => () => thumbMake(id));
    jobs.push(thumbDone, () => { if (g3ok) { mapBase(); mapLights(); } }, () => { if (g3ok) ids.forEach((id) => { if (EXPLORE[id].pos && id !== 'flyer') mapModel(id); }); });
    let done = 0, over = false;
    const show = () => { const f = done / jobs.length, k = Math.min(4, Math.floor(f * 5)); fill.style.width = Math.max(4, Math.round(f * 100)) + '%'; plates.forEach((p, i) => p.classList.toggle('on', f * 5 >= i + 1)); if (tip.textContent !== TIPS[k]) tip.textContent = TIPS[k]; };
    const finish = () => {
      if (over) return; over = true;
      parts.forEach((p) => { if (p) p.inert = false; });
      el.classList.add('out'); setTimeout(() => el.remove(), 520);
      if (tab === 'stories') renderStories();
    };
    const step = () => {
      if (over) return;
      if (done < jobs.length) { try { jobs[done](); } catch (e) { /* skip this one */ } done++; show(); setTimeout(step, 24); return; }
      setTimeout(finish, Math.max(350, 1500 - (Date.now() - t0)));
    };
    const skip = $('#bootskip');
    skip.addEventListener('click', finish);
    setTimeout(() => { if (!over) skip.hidden = false; }, 7000);
    show(); setTimeout(step, 250);
  })();
})();
