<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Bitsy's Maker Bin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen pastel play app. Three big picture tabs, one simple job per screen. Single light look on purpose. */
:root{
  color-scheme:light;
  --bg:#FFF6EC; --surface:#FFFFFF; --ink:#4A3F6B; --ink-soft:#6B618C;
  --mint:#C8F0DC; --mint-deep:#8EDDB8; --sky:#CFE6FB; --sky-deep:#A5D0F7; --lav:#E4D9FB; --lav-deep:#C5B2F4;
  --pink:#FFD9E5; --pink-deep:#FFB3C9; --butter:#FFF0B8; --butter-deep:#FFDD73; --peach:#FFE0C8; --peach-deep:#FFC49A;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',sans-serif; --body:'Nunito',ui-rounded,system-ui,sans-serif;
  --r:32px;
}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--lav-deep);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.app{display:flex;height:100%;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none;opacity:.55;z-index:0}
.rail{position:relative;z-index:1;flex:0 0 132px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-radius:0 40px 40px 0;box-shadow:none}
.tab{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:none;border-radius:28px;background:transparent;font-family:var(--display);font-weight:600;font-size:17px}
.tab .ico{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.tab .ico svg{width:40px;height:40px}
.tab[data-tab=bin] .ico{background:var(--sky)} .tab[data-tab=make] .ico{background:var(--peach)} .tab[data-tab=community] .ico{background:var(--pink)}
.tab[aria-current="page"]{background:var(--butter)}
.tab[aria-current="page"] .ico{transform:scale(1.08) rotate(-4deg)}
.stars{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:24px;background:var(--butter);border-radius:999px;padding:4px 14px 4px 8px}
.stars svg{width:30px;height:30px}
.rail .spacer{flex:1}
.gate{width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px dashed var(--lav-deep);border-radius:20px;background:transparent;color:var(--ink-soft);font-weight:800;font-size:12px;padding:8px 4px}
.gate .fill{position:absolute;inset:auto 0 0 0;height:0;background:var(--mint);transition:height .1s linear}
.gate>*:not(.fill){position:relative}
main{position:relative;z-index:1;flex:1;min-width:0;overflow-y:auto;padding-block:26px 44px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.hello{display:flex;align-items:center;gap:14px}
.hello .bot{flex:0 0 auto;animation:bob 3s ease-in-out infinite}
.bubble{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:32px;padding:14px 14px 14px 26px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.bubble p{margin:0;flex:1;font-family:var(--display);font-weight:600;font-size:clamp(22px,2.8vw,32px);line-height:1.15}
.say{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:none;background:var(--butter-deep);display:grid;place-items:center;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.say svg{width:32px;height:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:72px;padding:12px 34px;border-radius:999px;border:none;background:var(--surface);font-family:var(--display);font-weight:600;font-size:24px;box-shadow:0 1px 3px rgba(74,63,107,.08);transition:transform .08s}
.btn:active,.say:active,.card-btn:active{transform:scale(.97)}
.btn.go{background:var(--mint-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.btn.sun{background:var(--butter-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.btn.pinky{background:var(--pink-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.btn.small{min-height:52px;font-size:18px;padding:8px 22px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:34px;height:34px}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.center-row{justify-content:center}
.status{font-weight:800;min-height:1.4em;margin:0;text-align:center}
.status.warn{color:#B0476A}
.note{font-size:15px;color:var(--ink-soft);margin:0}
.note a,.grown a{color:#5A49B8;font-weight:700}
/* My bin */
.snap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--sky);border-radius:var(--r);padding:16px 20px}
.snap .thumb{width:120px;height:90px;border-radius:20px;object-fit:cover;border:4px solid var(--surface)}
.snap .txt{flex:1;min-width:160px;font-family:var(--display);font-weight:600;font-size:22px}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px}
.matwrap{position:relative}
.mat{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border:none;border-radius:32px;background:var(--surface);font-family:var(--display);font-weight:600;font-size:19px;box-shadow:0 1px 3px rgba(74,63,107,.08);transition:transform .08s}
.mat:active{transform:scale(.97)}
.mat svg{width:84px;height:84px}
.mat.has{background:var(--mint)}
.mat.pop svg{animation:pop .35s ease-out}
.count{position:absolute;top:-8px;right:-6px;min-width:46px;height:46px;padding:0 8px;border-radius:23px;background:var(--pink-deep);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;border:4px solid var(--bg);font-variant-numeric:tabular-nums}
.minus{position:absolute;top:-8px;left:-6px;width:46px;height:46px;border-radius:50%;border:4px solid var(--bg);background:var(--lav);font-family:var(--display);font-weight:700;font-size:28px;line-height:1;display:grid;place-items:center}
/* Make */
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{min-height:56px;padding:6px 22px 6px 10px;border-radius:999px;border:none;background:var(--surface);font-family:var(--display);font-weight:600;font-size:20px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.chip svg{width:40px;height:40px}
.chip[aria-pressed="true"]{background:var(--lav-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card-btn{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 14px 18px;border:none;border-radius:var(--r);background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08);text-align:center;transition:transform .08s;animation:rise .4s ease-out both}
.card-btn .pic{width:100%;height:140px;border-radius:24px;display:grid;place-items:center}
.card-btn .pic svg{height:116px;width:auto;max-width:90%}
.card-btn h3{font-size:24px}
.card-btn.ready .pic svg{animation:bob 2.6s ease-in-out infinite}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 16px 4px 6px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--mint-deep)}
.pill svg{width:30px;height:30px}
.find{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-family:var(--display);font-weight:600;font-size:18px}
.find span{display:inline-flex;align-items:center;gap:2px;background:var(--peach);border-radius:999px;padding:2px 12px 2px 4px}
.find svg{width:34px;height:34px}
/* Tutorial */
.tutbar{display:flex;align-items:center;gap:14px}
.tutbar h2{flex:1;min-width:0;font-size:clamp(24px,3vw,34px)}
.dots{display:flex;gap:6px}
.dots svg{width:34px;height:34px}
.stage{display:grid;grid-template-columns:120px minmax(0,1fr) 160px;min-height:430px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.edge{border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:600;font-size:22px;background:var(--lav)}
.edge svg{width:64px;height:64px}
.edge.next{background:var(--mint-deep);font-size:30px}
.edge:active{filter:brightness(.95)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;min-width:0;text-align:center}
.show{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:130px}
.show svg{width:118px;height:118px;animation:bob 2.4s ease-in-out infinite}
.show svg:nth-child(2){animation-delay:.4s}
.helper{display:inline-flex;align-items:center;gap:8px;background:var(--butter-deep);border-radius:999px;padding:6px 20px 6px 8px;font-family:var(--display);font-weight:600;font-size:20px}
.helper svg{width:40px;height:40px}
.steptext{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.3vw,38px);line-height:1.2;margin:0;max-width:22ch}
.gather{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.gather button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:none;border-radius:32px;background:var(--surface);font-family:var(--display);font-weight:600;font-size:22px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.gather button svg.ic{width:90px;height:90px}
.gather button[aria-pressed="true"]{background:var(--mint)}
.gather .tick{position:absolute;top:-8px;right:-6px;width:46px;height:46px;border-radius:50%;background:var(--mint-deep);border:4px solid var(--bg);display:grid;place-items:center}
.gather .tick svg{width:24px;height:24px}
/* Share */
.done{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.frame{aspect-ratio:4/3;max-width:100%;border-radius:var(--r);background:var(--surface);display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.frame img{width:100%;height:100%;object-fit:cover}
.frame svg{height:70%;width:auto}
.form{display:flex;flex-direction:column;gap:16px;align-items:stretch}
label.lbl{font-family:var(--display);font-weight:600;font-size:22px}
input[type=text]{width:100%;min-height:68px;border-radius:999px;border:4px solid var(--lav-deep);background:var(--surface);padding:8px 26px;font-family:var(--display);font-size:24px;font-weight:600}
.checked{display:flex;gap:10px;align-items:center;background:var(--sky);border-radius:24px;padding:10px 16px;font-weight:800;font-size:17px}
.checked svg{flex:0 0 40px;width:40px;height:40px}
/* Show & tell */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.post{position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(74,63,107,.08);display:flex;flex-direction:column;animation:rise .4s ease-out both}
.post:nth-child(3n+1){transform:rotate(-1.2deg)} .post:nth-child(3n+2){transform:rotate(1deg)}
.post .ph{border:none;padding:10px 10px 0;background:transparent;display:block;width:100%}
.post img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;background:var(--sky);display:block}
.post .cap{padding:10px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.post .cap b{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1}
.post .cap span{color:var(--ink-soft);font-weight:800;font-size:16px}
.post .actions{padding:0 12px 14px;display:flex;gap:8px}
.post .actions .btn{flex:1}
.heart{position:absolute;left:50%;top:40%;width:72px;height:72px;margin:-36px;pointer-events:none;animation:heart .9s ease-out forwards}
.empty{background:var(--surface);border-radius:var(--r);padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 1px 3px rgba(74,63,107,.08)}
/* Grown-ups */
.grown{font-size:16px}
.grown h2{font-size:24px}
.panel{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.facts b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.guide .g{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:18px;padding:10px}
.guide svg{flex:0 0 48px;width:48px;height:48px}
.guide p{margin:0;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--sky);margin-right:4px}
.tag.care{background:var(--butter-deep)} .tag.no{background:var(--pink-deep)}
/* Learn */
.tab[data-tab=learn] .ico{background:var(--lav)}
button.stars{border:none;box-shadow:0 1px 3px rgba(74,63,107,.08);min-height:60px}
.sec{font-size:26px}
.pill.cost{background:var(--butter-deep)} .pill.off{background:var(--lav);padding-left:16px}
.flipwrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.flip{width:min(440px,100%);height:340px;perspective:1200px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;font-family:var(--display);font-weight:600;font-size:28px}
.flip .f svg{width:160px;height:160px}
.flip .b{transform:rotateY(180deg)}
.flip .b svg{width:110px;height:110px}
.flip .b.yes{background:var(--mint)} .flip .b.no{background:var(--pink)}
.flip .big{font-size:46px;font-weight:700;line-height:1}
.flip .why{font-size:24px;line-height:1.2}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:600;font-size:30px}
.item svg{width:160px;height:160px;animation:bob 2.4s ease-in-out infinite}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:100%;max-width:760px}
.binbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px;border:none;border-radius:32px;font-family:var(--display);font-weight:600;font-size:26px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.binbtn:active{transform:scale(.97)}
.binbtn svg{width:84px;height:84px}
.scene{position:relative;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(74,63,107,.08);display:flex;flex-direction:column}
.world{display:block;width:100%;height:150px;transition:filter .4s}
.world .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.3,1.7,.5,1)}
.play{display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap;padding:18px 20px 22px;min-height:240px}
.tapt,.rub,.drag{border:none;background:none;padding:0}
.tapt svg,.rub svg{width:190px;height:190px;display:block}
.tapt:not([disabled]):active{transform:scale(.92)}
.tapt.hint,.rub.hint{animation:pulse 1.4s ease-in-out infinite}
.tapt.pop svg{animation:pop .35s ease-out}
.fallen svg{transform:rotate(78deg)}
.drive svg{animation:drive 1.5s ease-in forwards}
.rub{touch-action:none;cursor:grab}
.meter{width:220px;max-width:100%;height:18px;border-radius:9px;background:var(--lav);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint-deep);border-radius:9px}
.drag{touch-action:none;cursor:grab;position:relative;border-radius:28px;transition:transform .2s}
.drag svg{width:124px;height:124px;display:block}
.drag.sel{outline:5px dashed var(--lav-deep);outline-offset:2px}
.targets{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.target{border:none;background:var(--bg);border-radius:32px;padding:10px 20px 12px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:600;font-size:22px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.target svg{width:136px;height:136px}
.worldcap{position:absolute;left:16px;top:12px;font-family:var(--display);font-weight:600;font-size:20px;background:var(--surface);border-radius:999px;padding:2px 14px}
@keyframes grow{from{transform:scale(0)}}
@keyframes drive{to{transform:translateX(700px)}}
.shake{animation:shake .4s}
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:620px;margin:0 auto;width:100%}
.memo button{aspect-ratio:1;border:none;border-radius:28px;background:var(--lav-deep);box-shadow:0 1px 3px rgba(74,63,107,.08);display:grid;place-items:center;padding:0}
.memo button.open{background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.memo button.done{background:var(--mint);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.memo svg{width:72%;height:72%}
.memo .q{font-family:var(--display);font-size:52px;font-weight:700;color:#fff}
.bigstar svg{width:150px;height:150px;animation:pop .6s ease-out}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* World home and extras */
.tab[data-tab=home] .ico{background:var(--mint)}
@media (min-width:641px){.rail{gap:8px;padding-top:12px}.tab{padding:6px 4px;font-size:16px}.tab .ico{width:58px;height:58px}.tab .ico svg{width:34px;height:34px}}
.app.first .rail{display:none}
.mus{width:48px;height:48px;border-radius:50%;border:none;background:var(--sky);display:grid;place-items:center;flex:0 0 auto}
.mus svg{width:26px;height:26px}
.mus[aria-pressed="false"]{opacity:.45}
.botbtn{border:none;background:none;padding:0;flex:0 0 auto;border-radius:50%}
.botbtn.spin .bot svg{animation:spin .7s ease-in-out}
.botbtn.dance .bot svg{animation:dance .5s ease-in-out 6}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.world.big{height:auto;aspect-ratio:8/3;touch-action:none;cursor:pointer}
.world.big [data-th]{cursor:grab}
.world .in{transform-box:fill-box;transform-origin:50% 100%}
.world .in.wig{animation:wig .6s ease-in-out}
.world .in.flyoff{animation:flyoff 1.6s ease-in-out}
.tray{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--butter-deep);border-radius:999px;padding:4px 20px 4px 8px;font-family:var(--display);font-weight:600;font-size:20px;pointer-events:none;white-space:nowrap}
.tray svg{width:44px;height:44px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;border-radius:28px;background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08);font-family:var(--display);font-weight:600;font-size:20px;text-align:left;line-height:1.15;min-height:84px;min-width:0}
.mini svg{flex:0 0 52px;width:52px;height:52px}
.mini.done{background:var(--mint)}
.mini small{display:block;font-family:var(--body);font-weight:800;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:15px;text-align:center;line-height:1.1}
.stk .c{width:100px;height:100px;border-radius:50%;background:var(--surface);border:4px dashed var(--lav-deep);display:grid;place-items:center}
.stk.got .c{border:4px solid var(--butter-deep);background:var(--butter);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.stk .c svg{width:70px;height:70px}
.stk:not(.got) .c svg{filter:grayscale(1) brightness(1.5);opacity:.22}
.deco{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r);padding:12px 18px;box-shadow:0 1px 3px rgba(74,63,107,.08);font-family:var(--display);font-weight:600;font-size:22px}
.deco svg.pp{width:110px;height:100px}
.sw{width:56px;height:56px;border-radius:50%;border:5px solid var(--surface);box-shadow:0 0 0 3px var(--lav);background:#FFB3C9}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.play{position:relative}
.hand{position:absolute;left:0;top:0;width:64px;height:75px;pointer-events:none;z-index:6}
.catch{position:relative;height:380px;background:var(--sky);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(74,63,107,.08);touch-action:none;cursor:grab}
.cbin{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:120px}
.cbin svg{width:100%;height:100%}
.fall{position:absolute;top:0;width:70px;height:70px;will-change:transform}
.fall svg{width:100%;height:100%}
.spot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:720px;margin:0 auto;width:100%}
.spot button{border:none;border-radius:28px;background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08);padding:10px 6px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:600;font-size:16px;min-width:0}
.spot button svg{width:92px;height:92px;max-width:100%}
.spot button.found{background:var(--mint)}
.reacts{display:flex;gap:8px;justify-content:center;padding:0 12px 14px}
.reacts button{border:none;border-radius:999px;background:var(--bg);padding:4px 12px 4px 6px;display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:18px;min-height:44px}
.reacts button svg{width:30px;height:30px}
.reacts button[aria-pressed="true"]{background:var(--pink-deep)}
.gift{border:none;background:none;padding:0;animation:pulse 1.2s ease-in-out infinite}
.gift svg{width:150px;height:150px}
.rest{position:fixed;inset:0;z-index:50;background:rgba(74,63,107,.45);display:grid;place-items:center;padding:16px}
.rest .card{background:var(--surface);border-radius:var(--r);padding:28px;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:none;border-radius:999px;background:var(--bg);padding:8px 18px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--lav-deep)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-10px)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes flyoff{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-40px)}}
@media (max-width:640px){.trio{grid-template-columns:minmax(0,1fr)}.spot{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Soft 3D look: glossy raised surfaces, ambient shadows, shaded drawings */
body{background-image:radial-gradient(1100px 640px at 18% 0%,#FFFEFA,rgba(255,254,250,0) 70%),linear-gradient(180deg,#FFF6EC,#FCE9DA)}
.blob{filter:blur(1px)}
.blob::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,0) 58%)}
@media (min-width:641px){.rail{box-shadow:4px 0 18px rgba(74,63,107,.05)}}
.btn,.say,.mat,.card-btn,.mini,.chip,.binbtn,.target,.realbtn,.stars,.edge,.spot button,.memo button,.gather button,.pill,.tab .ico,.sw,.mus{position:relative;isolation:isolate}
.btn::before,.say::before,.mat::before,.card-btn::before,.mini::before,.chip::before,.binbtn::before,.target::before,.realbtn::before,.stars::before,.edge::before,.spot button::before,.memo button::before,.gather button::before,.pill::before,.tab .ico::before,.sw::before,.mus::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:none}
.mat,.bubble,.mini,.deco{box-shadow:0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07)}
.card-btn,.scene,.stage,.empty,.post,.frame{box-shadow:0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07)}
.card-btn .pic,.stepart{box-shadow:inset 0 4px 0 rgba(255,255,255,.6),inset 0 -12px 18px rgba(74,63,107,.07)}
svg.ic,.card-btn .pic svg,.frame svg,.stk.got .c svg,.deco svg.pp,.tapt svg,.rub svg,.item svg{filter:drop-shadow(0 2px 2px rgba(74,63,107,.13))}
.bot svg{filter:drop-shadow(0 3px 3px rgba(74,63,107,.14))}
.stepart svg>g{filter:drop-shadow(0 4px 3px rgba(74,63,107,.2))}
/* Touchable things get richer colour; backgrounds stay pale and quiet */
.card-btn,.binbtn,.target,.mini,.chip,.gather button,.spot button,.mat,.itray button,.memo button,.tab{--sky:#B7DBFA;--pink:#FFC4D6;--mint:#A9E7C9;--butter:#FFE58F;--lav:#D3C4F8;--peach:#FFD0AE}
.mat.has{background:#B4EAD0}
.btn:not(.go):not(.sun):not(.pinky){background:var(--sky-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.blob{opacity:.3}
.pill.grow{background:var(--mint)}
/* Grown-up talk prompts */
.talk{display:flex;gap:12px;align-items:center;background:var(--butter);border-radius:24px;padding:10px 12px 10px 16px;font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2;text-align:left;width:100%;max-width:640px}
.talk>svg{flex:0 0 44px;width:44px;height:44px}
.talk p{margin:0;flex:1;min-width:0}
.talk .say{width:52px;height:52px}
/* Truck road */
.road{width:min(620px,100%);touch-action:none;cursor:grab;border-radius:24px;overflow:hidden}
.road svg{display:block;width:100%;height:auto}
.road.hint{animation:pulse 1.4s ease-in-out infinite}
/* Clean & dry */
.cleanit{display:flex;flex-direction:column;align-items:center;gap:10px}
.tapt.wig svg{animation:wig .45s ease-in-out}
/* Invent */
.realbtn.invbtn{background:var(--peach-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.imat{position:relative;height:min(50vh,430px);min-height:260px;border-radius:var(--r);background:linear-gradient(180deg,#FFF3E2,#FBE4CA);box-shadow:inset 0 4px 0 rgba(255,255,255,.7),inset 0 -14px 24px rgba(74,63,107,.08),0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07);overflow:hidden;touch-action:none}
.ip{position:absolute;width:96px;height:96px;padding:0;border:none;background:none;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));touch-action:none;cursor:grab;border-radius:24px}
.ip span,.ip svg{display:block;width:100%;height:100%}
.ip.sel{outline:4px dashed var(--lav-deep);outline-offset:4px}
.ihint{position:absolute;left:0;right:0;bottom:16px;text-align:center;margin:0;font-family:var(--display);font-weight:600;font-size:22px;color:#C9B08E}
.itools{gap:10px}
.itools .btn{min-width:64px;padding:8px 14px}
.itools .btn svg{width:30px;height:30px}
.rainbow{width:30px;height:30px;border-radius:50%;background:conic-gradient(#FFB3C9,#FFDD73,#8EDDB8,#A5D0F7,#C5B2F4,#FFB3C9);border:3px solid #fff}
.itray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.itray button{position:relative;isolation:isolate;border:none;border-radius:24px;background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07);padding:8px;aspect-ratio:1;display:grid;place-items:center}
.itray button:active{transform:scale(.97)}
.itray svg{width:62px;height:62px}
/* Feedback: gentle wobble for "try again", small sparkle for "yes" */
.wobble{animation:wob .5s ease-in-out}
@keyframes wob{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.spk{position:fixed;width:30px;height:30px;margin:-15px;pointer-events:none;z-index:45;animation:spk .75s ease-out forwards}
.spk svg{width:100%;height:100%;display:block}
@keyframes spk{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0}}
/* Bitsy's path */
.stones{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 4px 12px}
.stone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:4px;font-family:var(--display);font-weight:600;font-size:17px;min-width:84px}
.stone b{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07);border:4px dashed var(--lav-deep)}
.stone.lit b{background:var(--t);border:4px solid var(--surface)}
.stone.next b{animation:pulse 1.6s ease-in-out infinite;border-style:solid;border-color:var(--butter-deep)}
.trail{flex:1 0 18px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--lav-deep) 0 8px,transparent 8px 14px);margin-bottom:26px}
.stagesec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.stagesec .sec{display:flex;align-items:center;gap:12px}
.sec small{display:block;font-family:var(--body);font-weight:700;font-size:16px;color:var(--ink-soft)}
.snum{flex:0 0 48px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.pill.fam{background:var(--butter-deep);padding-left:6px}
.free{display:inline;margin-left:8px;font-size:16px}
/* Cause and effect */
.chain{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;justify-content:center}
.cstep{flex:1 1 200px;max-width:300px;background:var(--surface);border-radius:var(--r);padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07);animation:rise .5s ease-out both}
.cstep:nth-child(3){animation-delay:.35s}.cstep:nth-child(5){animation-delay:.7s}
.cstep small{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.cstep svg{width:96px;height:96px}
.cstep p{margin:0;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2}
.carr{display:grid;place-items:center}
.carr svg{width:40px;height:40px}
.feel{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.feel p{margin:0;font-family:var(--display);font-weight:600;font-size:22px}
.feel>div{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.feel button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;min-height:110px;padding:10px 14px;border:none;border-radius:28px;background:var(--bg);font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.feel button svg{width:64px;height:64px}
.feel button[aria-pressed="true"]{background:var(--butter-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
/* Learn games */
.bins.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}
.binbtn span{text-align:center;line-height:1.1}
.bins .binbtn span{font-size:clamp(18px,2.3vw,26px)}
.binbtn small{font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink-soft)}
.pill.state{background:var(--peach-deep)}
.checks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.checks .pill.off{background:var(--lav)}
.checks.big .pill{border:none;min-height:60px;font-size:20px;padding:6px 18px 6px 10px}
.checks.big .pill svg{width:28px;height:28px}
.meter.waitm i{width:0;animation:fillm 2.8s linear forwards}
@keyframes fillm{to{width:100%}}
.pourbtn svg{width:min(300px,80vw);height:auto}
.pour .pd{animation:pd .6s linear infinite}
@keyframes pd{from{transform:translateY(0);opacity:1}to{transform:translateY(46px);opacity:0}}
.sunspin{animation:spin 8s linear infinite}
.item svg[viewBox="0 0 200 170"]{width:min(300px,80vw);height:auto;animation:none}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:14px;width:100%;max-width:640px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:120px;padding:12px 6px;border:none;border-radius:28px;background:var(--bg);font-family:var(--display);font-weight:600;font-size:20px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.tool svg{width:76px;height:76px}
.kinds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kinds svg{width:84px!important;height:84px!important;animation:none!important}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(520px,100%)}
.yn .binbtn svg{width:72px;height:72px}
.bigicon svg{width:150px;height:150px}
.bigicon .bot svg{width:150px;height:auto}
.wmini{flex:0 0 52px;width:52px;height:52px;display:grid;place-items:center}
.wmini svg{width:52px!important;height:52px!important}
.who{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--ink-soft);text-align:left;line-height:1.2}
.who svg{flex:0 0 36px;width:36px;height:36px}
.dress{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:none;border-radius:28px;background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08);font-family:var(--display);font-weight:600;font-size:17px;min-height:120px}
.dbtn[aria-pressed="true"]{background:var(--butter-deep);box-shadow:0 1px 3px rgba(74,63,107,.08)}
.talk.wkend{background:var(--peach-deep)}
.talk.wkend>svg{flex:0 0 52px;width:52px;height:52px}
.g1{display:flex;gap:12px;align-items:center}
.g1 svg{flex:0 0 64px;width:64px;height:64px}
.g1 p{margin:0}
.cbars{display:flex;flex-direction:column;gap:6px}
.cbars div{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;align-items:center;gap:8px;font-weight:800;font-size:14px}
.cbars i{display:block;height:14px;border-radius:7px;min-width:4px}
.guess{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(74,63,107,.08)}
.guess p{margin:0;font-family:var(--display);font-weight:600;font-size:24px;text-align:center}
.gicons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.gicons span{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:22px}
.gicons svg{width:64px;height:64px}
/* Invent story card and shelf */
.invcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:0 1px 3px rgba(74,63,107,.08),0 6px 18px rgba(74,63,107,.07)}
.ivpic{display:flex;gap:10px;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFF3E2,#FBE4CA);border-radius:24px;padding:12px;min-height:220px}
.ivpic svg{width:200px;height:200px}
.ivpic img{width:150px;height:150px;object-fit:cover;border-radius:18px;border:5px solid #fff;transform:rotate(-3deg)}
.ivtxt{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ivtxt small{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.ivtxt h2{font-size:clamp(28px,3.4vw,40px)}
.ivtxt p{margin:0;font-family:var(--display);font-weight:600;font-size:26px}
.ivmini svg{width:160px;height:160px}
.namechips{justify-content:center}
.bins.jobs{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));max-width:none}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 12px}
.shelfi{flex:0 0 130px;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;border-radius:24px;background:var(--surface);box-shadow:0 1px 3px rgba(74,63,107,.08);padding:8px;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1}
.shelfi svg{width:96px;height:96px}
.world.garden{cursor:default;touch-action:auto}
/* Bigger touch targets for small hands (at least 60px) */
.btn.small{min-height:60px}
.reacts button{min-height:60px;min-width:60px;padding:6px 12px;justify-content:center}
.reacts button svg{width:34px;height:34px}
.minus{width:56px;height:56px;top:-12px;left:-10px}
.mus{width:60px;height:60px}
.chip{min-height:60px}
.sw{width:60px;height:60px}
/* Strong outlines for bright rooms or low vision */
.app.hc{--ink-soft:#3B3256}
.app.hc .blob{display:none}
.app.hc .bubble,.app.hc .card-btn,.app.hc .btn,.app.hc .binbtn,.app.hc .target,.app.hc .mini,.app.hc .mat,.app.hc .scene,.app.hc .empty,.app.hc .tool,.app.hc .cstep,.app.hc .feel button,.app.hc .realbtn,.app.hc .talk,.app.hc .chip,.app.hc .itray button,.app.hc .spot button,.app.hc .memo button,.app.hc .gather button,.app.hc .dbtn,.app.hc .stone b{outline:3px solid var(--ink);outline-offset:-3px}
.app.hc .bubble p,.app.hc h2,.app.hc h3{color:#2E2647}
/* Left-handed: things to drag sit on the right */
.app.lefty .play{flex-direction:row-reverse}
/* Step pictures */
.stepart{width:min(430px,100%);background:var(--bg);border-radius:24px;overflow:hidden}
.stepart svg{display:block;width:100%;height:auto}
.stepart .mv{animation:mv 1.1s ease-in-out infinite alternate}
.stepart .fo{opacity:0;animation:fo 2.2s ease-in-out infinite}
.stepart .fd{animation:fd 2.2s ease-in-out infinite}
.stepart .tw{transform-box:fill-box;transform-origin:center;animation:tw 1s ease-in-out infinite alternate}
@keyframes mv{to{transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--dr,0))}}
@keyframes fo{0%,40%{opacity:1}60%,100%{opacity:0}}
@keyframes fd{0%,40%{opacity:0}60%,100%{opacity:1}}
@keyframes tw{from{transform:scale(.6);opacity:.5}}
/* Real life */
.realbtn{display:flex;align-items:center;gap:16px;width:100%;border:none;border-radius:var(--r);background:var(--sky-deep);box-shadow:0 1px 3px rgba(74,63,107,.08);padding:12px 22px;font-family:var(--display);text-align:left}
.realbtn:active{transform:scale(.97)}
.realbtn svg.ic{width:72px;height:72px;flex:0 0 72px}
.realbtn b{display:block;font-weight:600;font-size:28px;line-height:1.1}
.realbtn small{font-family:var(--body);font-weight:800;font-size:16px}
.realbtn .go{margin-left:auto;flex:0 0 44px}
.realbtn .go svg{width:44px;height:44px;display:block}
.album{display:flex;gap:18px;overflow-x:auto;padding:6px 6px 14px}
.pol{flex:0 0 150px;background:#fff;border-radius:14px;padding:8px 8px 6px;box-shadow:0 1px 3px rgba(74,63,107,.08);font-family:var(--display);font-weight:600;font-size:15px;text-align:center;line-height:1.2}
.pol:nth-child(odd){transform:rotate(-2deg)} .pol:nth-child(even){transform:rotate(2deg)}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
.tilt{display:block;transform:rotate(125deg)}
.hold{position:relative;overflow:hidden;touch-action:none}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.6)}
.hold>*:not(.fill){position:relative}
[data-real]{cursor:pointer}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:14px 24px;border-radius:999px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes rise{from{opacity:.4;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes heart{0%{transform:scale(.3);opacity:1}60%{transform:scale(1.3) translateY(-30px);opacity:1}100%{transform:scale(1.1) translateY(-90px);opacity:0}}
@media (max-width:860px){
  .done{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-columns:minmax(0,1fr)}
  .edgebar{display:grid;grid-template-columns:1fr 1.5fr}

function pop(f=520){ if (S.quiet) return; try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime; o.type="sine"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.6,t+.08); g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.16); o.connect(g).connect(ac.destination); o.start(); o.stop(t+.17); } catch(e){} }
function speak(text, force){ try { if (!("speechSynthesis" in window) || (S.mute && !force)) return; speechSynthesis.cancel(); const tr = T(text), u = new SpeechSynthesisUtterance(tr); u.lang = tr!==text ? LANG[S.lang].code : "en-US";
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase())); const nice = vs.find(v => /samantha|karen|moira|tessa|female|zira|aria|jenny/i.test(v.name)) || vs[0]; if (nice) u.voice = nice;
  u.rate=.9; u.pitch=1.2; speechSynthesis.speak(u); } catch(e){} }

function confetti(){
  if (calm()) return;
  const c = $("#confetti"), x = c.getContext("2d"); c.hidden=false; c.width=innerWidth; c.height=innerHeight;
  const cols = ["#FFB3C9","#A5D0F7","#FFDD73","#8EDDB8","#C5B2F4","#FFC49A"];
  const ps = Array.from({length:60}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:6+Math.random()*8, c:cols[Math.random()*cols.length|0], vy:2+Math.random()*4, vx:-1.5+Math.random()*3, a:Math.random()*6, round:Math.random()<.5}));
  const t0 = performance.now();
  (function tick(now){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.y+=p.vy; p.x+=p.vx+Math.sin(p.a+=.08); x.fillStyle=p.c; x.beginPath(); if (p.round) x.arc(p.x,p.y,p.r/2,0,7); else x.rect(p.x,p.y,p.r,p.r*.6); x.fill(); });
    if (now-t0 < 1400) requestAnimationFrame(tick); else { x.clearRect(0,0,c.width,c.height); c.hidden=true; }
  })(t0);
}

function shrink(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); const dataUrl=c.toDataURL("image/jpeg",.72); c.toBlob(b => res({dataUrl, blob:b}), "image/jpeg", .82); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

async function identify(){

      { images: S.photoBlob, modelTier: "default" });
    const counts = (out && typeof out.counts === "object" && out.counts) ? out.counts : {};
    let found = 0; const guess = {};
    ORDER.forEach(k => { const n=Math.max(0,Math.min(99,Math.round(Number(counts[k])||0))); if (n){ guess[k]=n; found+=n; } });

  } catch (e) {

    else { items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), name, project:S.proj.name, img:S.shareImg, at:new Date().toISOString()}); await ref.set({items}); S.shared=true; S.shareImg=null; pop(780); }
  } catch (e) { S.shareMsg = e?.code==="quota_exceeded" ? "!The board is full. Ask a grown-up." : "!It didn't send. Try again."; }
  S.sharing=false; render();
}
async function moderate(key, approve){
  const [uid,id,anon] = key.split("|"), db=S.caps.db; if (!db) return;
  const item = S.pending.find(x => x.uid===uid && x.id===id); if (!item) return;
  try {
    if (approve) await db.doc("posts/"+id).set({name:anon ? "A young maker" : item.name, project:item.project, img:item.img, at:item.at, approvedAt:new Date().toISOString()});
    const ref = db.doc("submissions/"+uid), snap = await ref.get();
    await ref.set({items:(snap.exists && Array.isArray(snap.data().items)) ? snap.data().items.filter(x => x.id!==id) : []});
    toast(approve ? "Approved. It's growing in our garden." : "Removed");
  } catch(e){ toast("That didn't work. Try again."); }
}
async function unpost(id){ try { await S.caps.db.doc("posts/"+id).delete(); toast("Taken down"); } catch(e){ toast("That didn't work. Try again."); } }

// Grown-up gate: press and hold 3 seconds
(() => {
  const b=$("#gateBtn"), fill=$("#gateFill"); let t0=0, raf=0;
  const stop = () => { cancelAnimationFrame(raf); fill.style.height="0"; t0=0; };
  const tick = () => { const p=Math.min(1,(performance.now()-t0)/3000); fill.style.height=(p*100)+"%"; if (p>=1){ stop(); S.grown=true; go("grown"); } else raf=requestAnimationFrame(tick); };
  const start = () => { t0=performance.now(); raf=requestAnimationFrame(tick); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); start(); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener("keydown", (e) => { if ((e.key==="Enter"||e.key===" ") && !e.repeat){ e.preventDefault(); start(); } });
  b.addEventListener("keyup", stop);
})();

function bindHold(v){
  v.querySelectorAll("[data-hold]").forEach(b => { const fill = b.querySelector(".fill"); let t0 = 0, raf = 0;
    const stop = () => { cancelAnimationFrame(raf); t0 = 0; if (fill) fill.style.width = "0"; };
    const tick = () => { const p = Math.min(1, (performance.now()-t0)/2000); if (fill) fill.style.width = (p*100)+"%"; if (p>=1){ stop(); return learnAct("realdone"); } raf = requestAnimationFrame(tick); };
    const start = () => { t0 = performance.now(); raf = requestAnimationFrame(tick); };
    b.onpointerdown = (e) => { e.preventDefault(); start(); }; b.onpointerup = b.onpointerleave = b.onpointercancel = stop;
    b.onkeydown = (e) => { if ((e.key==="Enter" || e.key===" ") && !e.repeat){ e.preventDefault(); start(); } }; b.onkeyup = stop; });
}

  const out = [ch("Empty", c.includes("shake") || c.includes("look") || st.found.some(p => LIQUIDS.includes(p)), !LIQUIDS.some(p => f[p] && st.found.includes(p))),
    ch("Clean", c.includes("look") || st.found.some(p => DIRTS.includes(p)), !DIRTS.some(p => f[p] && st.found.includes(p))),
    ch("Dry", c.includes("feel") || st.found.includes("wet"), !(f.wet && st.found.includes("wet")))];
  ["cap","flat","label","batt","oil"].forEach(p => { if (st.found.includes(p) && !st.fixed.includes(p)) out.push(`<span class="pill warn">! ${({cap:"Loose cap", flat:"Bulky", label:"Shampoo label", batt:"Battery", oil:"Oily"})[p]}</span>`); });
  return out.join("");
}

function inspectAct(a, v){
  const L = S.L; if (!L || L.mode!=="inspect") return;
  const it = L.items[L.i], st = L.st, say = (m, mood) => { L.msg = m; L.mood = mood || "think"; render(); speak(m); };
  if (a==="ichk"){
    if (!st.checked.includes(v)) st.checked.push(v);
    L.flip = v==="turn";
    let pre = "";
    if (it.mystery && !st.rev){ st.rev = true; pre = `It's ${/^[aeiou]/i.test(it.real) ? "an" : "a"} ${it.real.toLowerCase()}! `; }
    const nowFound = Object.entries(it.probs).filter(([p, how]) => (how===v || (v==="look" && LIQUIDS.includes(p)) || (it.mystery && v==="look" && p==="batt")) && !st.found.includes(p) && !st.fixed.includes(p)).map(([p]) => p);
    st.found.push(...nowFound);
    const def = {shake: Object.keys(it.probs).some(p => LIQUIDS.includes(p) && !st.fixed.includes(p)) ? "Slosh! Something inside." : "It's empty!", look:"Clean inside!", turn:"Nothing underneath.", feel: st.found.includes("wet") && !st.fixed.includes("wet") ? "Still wet." : "It's dry!"}[v];
    sfx(v==="shake" && Object.keys(iflags(it, st)).some(p => LIQUIDS.includes(p)) ? "water" : v==="turn" ? "boing" : "pop");
    return say(pre + (nowFound.length ? nowFound.map(p => PROB[p].find).join(" ") : def));
  }
  if (a==="ifix"){
    const fx = FIX[v]; if (!fx) return;
    if (v==="rinse" && Object.keys(it.probs).some(p => LIQUIDS.includes(p) && !st.fixed.includes(p))){ hmm(); wobble("#iItem"); return say("Pour it out first!", "sad"); }
    if (L.anim===1) return;
    if (!L.anim && !calm() && document.getElementById("iItem")){ L.anim = 1; document.getElementById("iItem").classList.add("act-"+v); sfx(fx.snd); setTimeout(() => { if (S.L===L){ L.anim = 2; inspectAct(a, v); } }, 720); return; }
    const played = L.anim===2; L.anim = 0;
    fx.fixes.forEach(p => { if (!st.fixed.includes(p) && (it.probs[p] || st.found.includes(p))){ st.fixed.push(p); if (!st.found.includes(p)) st.found.push(p); } });
    if (v==="rinse" && !st.found.includes("wet")){ st.found.push("wet"); st.fixed = st.fixed.filter(p => p!=="wet"); }
    if (!played) sfx(fx.snd); setTimeout(() => sparkle("#iItem"), 60);
    return say(fx.say, true);
  }
  if (a==="idec"){
    if (it.mystery && !st.rev){ hmm(); return say("What is it? Tap a tool!", "think"); }
    const req = [...Object.keys(it.probs), ...st.found].filter(p => PROB[p] && PROB[p].fix && !PROB[p].opt && !st.fixed.includes(p));
    if ((v==="blue" || v==="reuse") && req.length && it.ok[v]){
      const p = req[0], unseen = !st.found.includes(p); hmm(); wobble("#iItem");
      return say(PROB[p].clue + (unseen ? " Can you check?" : " Help it get ready!"), "think");
    }
    const hidden = Object.keys(it.probs).filter(p => !PROB[p].opt && !st.found.includes(p) && !st.fixed.includes(p));
    if (!it.ok[v] && hidden.length && v!=="grown"){ hmm(); wobble("#iItem"); return say("Hmm, let's check it first!", "think"); }
    if (it.ok[v]){
      const tips = Object.keys(it.probs).filter(p => PROB[p].opt && !st.fixed.includes(p)).map(p => PROB[p].opt).join(" ");
      if (v===it.best) L.right++; stat("inspect");
      L.stage = "result"; L.whyDone = false; sfx("tada"); setTimeout(() => sparkle("#iItem"), 60);
      return say(`${it.ok[v]}${tips ? " "+tips : ""}`, true);
    }
    hmm(); wobble(`[data-l="idec"][data-v="${v}"]`);
    return say(it.no[v] || (v==="grown" ? "Asking a grown-up is always okay! Let's try too." : "Hmm, a better place?"), v==="grown" ? true : "think");
  }
  if (a==="iwhy"){ L.stage = "why"; L.whyBad = null; L.wo = shuffle([0,1,2]); pop(560); return say(WHY[it.why].q, "think"); }
  if (a==="iwhyans"){
    const W = WHY[it.why], o = W.opts[+v]; if (!o) return;
    if (o[2]){ addWonder(W.q, "Because "+o[0].charAt(0).toLowerCase()+o[0].slice(1)+"."); L.stage = "result"; L.whyDone = true; sfx("tada"); return say(`Yes! ${o[0]}.`, true); }
    L.whyBad = +v; hmm(); return say("Hmm, try another!", "think");
  }
  if (a==="inext"){ if (L.i<L.items.length-1){ L.i++; L.st = newIst(); L.stage = "check"; L.flip = false; L.whyDone = false; const n = L.items[L.i]; pop(600); return say(n.bitsy || `${n.mystery ? "A mystery thing" : n.name}! Let's check.`, "think"); }
    L.stage = "teach"; L.teach = []; pop(600); return say("Teach Blue Bin! Pick three.", true); }
  if (a==="iteach"){ L.teach = L.teach.includes(v) ? L.teach.filter(x => x!==v) : [...L.teach, v].slice(-3); pop(560); return render(); }
  if (a==="iteachgo"){
    const right = TEACH.filter(x => x[3]).map(x => x[0]), ok = L.teach.length===3 && L.teach.every(x => right.includes(x));
    if (ok){ addWonder("What should things be before they go in Blue Bin?", "Empty, clean and dry!"); return win("Empty, clean and dry! You're an inspector!", ["inspect"], 1); }
    hmm(); return say("Hmm, what did we check every time?", "think");
  }
}

const BOOTTIPS = ["Waking up Bitsy…", "Watering the garden…", "Polishing the blue bin…", "Calling the animal friends…", "Hiding treasures in the grass…"];
function bootRun(){
  const boot = document.getElementById("boot"); if (!boot) return;
  const fill = document.getElementById("bootFill"), tip = document.getElementById("bootTip"), go = document.getElementById("bootGo"), bar = boot.querySelector(".bootbar"), fr = document.getElementById("bootFriends");
  if (fr) fr.innerHTML = ["cat","hornbill","otter","pangolin"].map((id, i) => `<span style="animation-delay:${.3+i*.18}s">${FR[id]}</span>`).join("");
  const t0 = performance.now(), MIN = calm() ? 400 : 2000; let p = 0, i = 0, ready = false;
  const fonts = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  fonts.then(() => { ready = true; });
  const tick = () => {
    const el = performance.now()-t0, target = Math.min(ready ? 100 : 88, el/MIN*100);
    p += (target-p)*.12 + .3; p = Math.min(p, target);
    fill.style.width = p.toFixed(1)+"%"; bar.setAttribute("aria-valuenow", Math.round(p));
    const ti = Math.min(BOOTTIPS.length-1, Math.floor(p/100*BOOTTIPS.length)); if (ti!==i){ i = ti; tip.textContent = BOOTTIPS[i]; }
    if (p>=99.5 && ready){ fill.style.width = "100%"; bar.setAttribute("aria-valuenow", 100); return done(); }
    requestAnimationFrame(tick);
  };
  const done = () => {
    tip.textContent = S.seen && S.name ? `Welcome back, ${S.name}!` : S.seen ? "Welcome back, helper!" : "Hello, new helper!";
    boot.classList.add("ready"); go.hidden = false; go.focus();
  };
  go.onclick = () => {
    try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==="suspended") ac.resume(); } catch(e){}
    sfx("tada"); boot.classList.add("out");
    setTimeout(() => { boot.remove(); render(); const g = S.seen ? (S.name ? `Hi ${S.name}! Let's help the neighbourhood!` : "Hi! Let's help the neighbourhood!") : ""; if (g) speak(g); }, calm() ? 10 : 480);
  };
  requestAnimationFrame(tick);
}

  document.body.appendChild(ov);

}

function pilotSummary(){
  const ss = PILOT.sessions, mins = (s) => Math.max(1, Math.round(Object.values(s.screens||{}).reduce((x, y) => x+y, 0)/60000));
  const agg = {}; ss.forEach(s => { Object.entries(s.dead||{}).forEach(([k, v]) => { agg[k] = agg[k] || {dead:0, wrong:0, time:0}; agg[k].dead += v; }); Object.entries(s.wrong||{}).forEach(([k, v]) => { agg[k] = agg[k] || {dead:0, wrong:0, time:0}; agg[k].wrong += v; }); Object.entries(s.screens||{}).forEach(([k, v]) => { agg[k] = agg[k] || {dead:0, wrong:0, time:0}; agg[k].time += v; }); });
  const hard = Object.entries(agg).map(([k, v]) => [k, v, v.dead*2 + v.wrong]).filter(x => x[2]>0).sort((x, y) => y[2]-x[2]).slice(0, 4);
  const like = (v) => v==="yes" ? "Yes" : v==="ok" ? "A bit" : v==="no" ? "No" : "–";
  return `<h3 style="margin:8px 0 0">Results so far (${ss.length} session${ss.length===1?"":"s"})</h3>

function pilotText(){

}
